name: Set Start Date on In Progress

on:
  issues:
    types: [edited]

jobs:
  set-start-date:
    runs-on: ubuntu-latest

    steps:
      - name: Check if status changed to In progress
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;

            // Only proceed if issue has project items
            const projectItems = await github.graphql(`
              query($issueId: ID!) {
                node(id: $issueId) {
                  ... on Issue {
                    projectItems(first: 10) {
                      nodes {
                        id
                        project {
                          id
                        }
                        fieldValues(first: 20) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              field {
                                ... on ProjectV2SingleSelectField {
                                  name
                                }
                              }
                              name
                            }
                            ... on ProjectV2ItemFieldDateValue {
                              field {
                                ... on ProjectV2FieldCommon {
                                  name
                                }
                              }
                              date
                              id
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `, {
              issueId: issue.node_id
            });

            return projectItems;

      - name: Update Start Date if status is In progress
        uses: actions/github-script@v7
        with:
          script: |
            const data = ${{ steps.check.outputs.result }};
            const today = new Date().toISOString().split('T')[0];

            for (const item of data.node.projectItems.nodes) {
              let statusField = null;
              let startDateField = null;
              let startDateFieldId = null;

              for (const field of item.fieldValues.nodes) {
                if (field.field?.name === "Status" && field.name === "In progress") {
                  statusField = true;
                }

                if (field.field?.name === "Start date") {
                  startDateField = field;
                  startDateFieldId = field.id;
                }
              }

              if (statusField && startDateFieldId) {
                await github.graphql(`
                  mutation($itemId: ID!, $fieldId: ID!, $date: Date!) {
                    updateProjectV2ItemFieldValue(input: {
                      itemId: $itemId
                      fieldId: $fieldId
                      value: { date: $date }
                    }) {
                      projectV2Item {
                        id
                      }
                    }
                  }
                `, {
                  itemId: item.id,
                  fieldId: startDateFieldId,
                  date: today
                });
              }
            }
